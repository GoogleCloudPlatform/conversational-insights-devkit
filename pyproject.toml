[build-system]
requires = ["setuptools>=82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cxidk"
version = "2.0.0"
authors = [
  { name="Thiago Alberto", email="alrrtas@gmail.com" },
]
description = "AI-native Python toolkit, MCP server, and ADK toolset for Google Cloud Conversational Insights."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
keywords = [
    "ccai-insights",
    "conversational-insights",
    "contact-center-ai",
    "customer-engagement-suite",
    "dialogflow",
    "google-cloud",
    "mcp",
    "mcp-server",
    "google-adk",
    "agent-skills",
    "aws-transcribe",
    "genesys-cloud",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Telephony",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "google-api-core>=2.28.0",
    "google-auth>=2.62.2",
    "google-cloud-contact-center-insights>=1.27.0",
    "google-cloud-storage>=3.9.0",
    "google-genai>=2.30.0,<3.0.0",
    "grpcio>=1.83.0",
    "grpcio-status>=1.83.0",
    "jsonschema>=4.20.0",
    "pydantic>=2.12.5",
    "pyjwt>=2.15.1",
    "requests>=2.34.2",
]

[project.optional-dependencies]
speech = [
    "google-cloud-speech>=2.28.0",
    "google-cloud-texttospeech>=2.21.0",
]
dlp = [
    "google-cloud-dlp>=3.40.0",
]
audio = [
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "pydub>=0.25.1",
]
agents = [
    "google-cloud-dialogflow>=2.34.0",
    "google-cloud-dialogflow-cx>=1.37.0",
]
sheets = [
    "gspread>=6.0.0",
    "pandas>=2.2.0",
]
iam = [
    "google-cloud-iam>=2.16.0",
    "google-cloud-resource-manager>=1.14.0",
]
mcp = [
    "mcp>=2.3.0,<3.0.0",
    "opentelemetry-api>=1.45.2",
]
adk = [
    "google-adk>=2.14.1,<3.0.0",
    "mcp>=2.3.0,<3.0.0",
]
insight-refinements = [
    "google-cloud-bigquery[bqstorage,pandas]>=3.40.0",
    "google-cloud-logging>=3.10.0",
    "google-genai>=2.30.0,<3.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.8.0",
    "tabulate>=0.9.0",
]
all = [
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "google-adk>=2.14.1,<3.0.0",
    "google-cloud-bigquery[bqstorage,pandas]>=3.40.0",
    "google-cloud-dialogflow>=2.34.0",
    "google-cloud-dialogflow-cx>=1.37.0",
    "google-cloud-dlp>=3.40.0",
    "google-cloud-iam>=2.16.0",
    "google-cloud-logging>=3.10.0",
    "google-cloud-resource-manager>=1.14.0",
    "google-cloud-speech>=2.28.0",
    "google-cloud-texttospeech>=2.21.0",
    "google-genai>=2.30.0,<3.0.0",
    "gspread>=6.0.0",
    "mcp>=2.3.0,<3.0.0",
    "opentelemetry-api>=1.45.2",
    "pandas>=2.2.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.8.0",
    "tabulate>=0.9.0",
]
dev = [
    "Flask>=3.1.3",
    "Flask-Cors>=6.0.5",
    "Werkzeug>=3.1.9",
    "build>=1.2.0",
    "cloudevents>=1.11.0",
    "coverage",
    "functions-framework>=3.8.0",
    "httpx>=0.27.0",
    "mypy",
    "pandas-stubs",
    "pylint>=4.0.9",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov",
    "pytest-mock",
    "types-tabulate",
]
test = [
    "Flask>=3.1.3",
    "Flask-Cors>=6.0.5",
    "Werkzeug>=3.1.9",
    "cloudevents>=1.11.0",
    "functions-framework>=3.8.0",
    "httpx>=0.27.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-mock",
]

[project.urls]
Homepage = "https://github.com/GoogleCloudPlatform/conversational-insights-devkit"
Repository = "https://github.com/GoogleCloudPlatform/conversational-insights-devkit"
Documentation = "https://github.com/GoogleCloudPlatform/conversational-insights-devkit/blob/main/README.md"
LLMContext = "https://raw.githubusercontent.com/GoogleCloudPlatform/conversational-insights-devkit/main/llms-full.txt"
Issues = "https://github.com/GoogleCloudPlatform/conversational-insights-devkit/issues"

[project.scripts]
cxidk = "cxidk.ai.mcp.__main__:main"
cxidk-mcp = "cxidk.ai.mcp.__main__:main"

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true

# Ignore missing stubs for specific third-party libraries
[[tool.mypy.overrides]]
module = [
  "cxidk.*",
  "cloudevents.*",
  "functions_framework",
  "google.*",
  "gspread",
  "httpx.*",
  "jwt.*",
  "mcp.*",
  "opentelemetry.*",
  "pydub",
  "pytest",
  "requests",
  "starlette.*",
  "tabulate",
  "tabulate.*",
  "unittest.*",
  "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
  "src",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.package-data]
"cxidk" = ["py.typed", "llms.txt"]
"cxidk.workflow.utils.schemas" = ["*.json"]
"cxidk.workflow.utils.defaults" = ["*.json"]
"cxidk.ai.skills" = ["**/*.md", "*/*.md"]

[tool.pylint.main]
source-roots = ["src"]